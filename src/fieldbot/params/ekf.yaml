### ekf_filter_node configuration ###
ekf_filter_node_odom:
  ros__parameters:
    use_sim_time: true
    frequency: 30.0
    sensor_timeout: 0.1
    two_d_mode: true
    publish_acceleration: false
    publish_tf: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    # Wheel Odometry
    odom0: /diff_drive_base_controller/odom
    odom0_config: [false, false, false, # x, y, z
                   false, false, false, # roll, pitch, yaw
                   true,  true,  false, # vx, vy, vz
                   false, false, true,  # vroll, vpitch, vyaw
                   false, false, false] # ax, ay, az
    odom0_differential: false
    odom0_relative: false

    # IMU
    imu0: /imu
    imu0_config: [false, false, false,
                  false, false, true, # Only Yaw
                  false, false, false,
                  false, false, true, # Angular velocity yaw
                  false, false, false]
    imu0_differential: false
    imu0_relative: true
    imu0_queue_size: 10
    imu0_remove_gravitational_acceleration: true

ekf_filter_node_map:
  ros__parameters:
    use_sim_time: true
    frequency: 30.0
    sensor_timeout: 0.1
    two_d_mode: true
    publish_acceleration: false
    # Disable TF publishing to avoid conflict/drift with navsat_transform
    publish_tf: false

    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: map

    # Wheel Odometry (velocity only)
    odom0: /diff_drive_base_controller/odom
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  true,  false,
                   false, false, true,
                   false, false, false]
    odom0_differential: false
    odom0_relative: false

    # GPS Odometry (from navsat_transform)
    odom1: /odometry/gps
    odom1_config: [true,  true,  false, # x, y (absolute)
                   false, false, false,
                   false, false, false,
                   false, false, false,
                   false, false, false]
    odom1_differential: false
    odom1_relative: false

    # IMU
    imu0: /imu
    imu0_config: [false, false, false,
                  false, false, true,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_differential: false
    imu0_relative: false  # Global IMU usually provides absolute heading if magnetometer is fused

navsat_transform:
  ros__parameters:
    use_sim_time: true
    magnetic_declination_radians: 0.0
    yaw_offset: 0.0 # Gazebo IMU usually matches world frame
    zero_altitude: true
    # Directly publish map->odom transform to prevent EKF feedback loops
    publish_filtered_gps: true
    broadcast_cartesian_transform: true
    broadcast_cartesian_transform_as_parent_frame: true
    use_odometry_yaw: false
    wait_for_datum: false

